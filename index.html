<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>기하 수업 룰렛</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}textarea,input,select,button{font:inherit}img{max-width:100%}</style>
<style>
/* Layout: arcade night — glowing stage on the left, control console on the right; stacks on phones.
   One deliberate dark look for projectors, so there is no light variant. */
:root{
  --paper:#0a0d22; --panel:#121735; --panel-2:#192048; --ink:#eef1ff; --muted:#929bcc; --line:#2b3468; --grid:rgba(120,140,255,.07);
  --accent:#38e1ff; --on-accent:#041322; --mark:#ffd23f; --on-mark:#1d1500; --pink:#ff3d81; --violet:#8b5cff;
  --sphere:rgba(56,225,255,.06); --red:#ff4d6d;
  --felt:#1d7550; --felt-deep:#114a31; --felt-ink:#eef4ec; --rail:#5c361b; --rail-hi:#7f522a; --pocket:#050505;
  --display:"Black Han Sans","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
body{
  background-color:var(--paper); color:var(--ink); font-family:var(--body); font-size:15px; line-height:1.55;
  background-image:
    radial-gradient(900px 520px at 8% -8%,rgba(139,92,255,.32),transparent 60%),
    radial-gradient(800px 520px at 100% 110%,rgba(56,225,255,.18),transparent 60%),
    radial-gradient(600px 380px at 70% 0%,rgba(255,61,129,.14),transparent 60%),
    linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:auto,auto,auto,32px 32px,32px 32px;background-attachment:fixed;
}
.app{max-width:1200px;margin:0 auto;padding-block:22px 44px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px 24px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font:700 12px var(--mono);letter-spacing:.14em;color:var(--accent);text-transform:uppercase;padding:4px 10px;border:1px solid rgba(56,225,255,.4);border-radius:999px;background:rgba(56,225,255,.08)}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.25}}
h1{font-family:var(--display);font-weight:400;font-size:clamp(34px,6vw,62px);line-height:1.04;margin:10px 0 0;text-wrap:balance;letter-spacing:.01em;
  background:linear-gradient(92deg,#7cf0ff 0%,#fff 38%,#ffd23f 66%,#ff5c9a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(56,225,255,.35)) drop-shadow(0 4px 0 rgba(0,0,0,.45))}
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:6px;background:rgba(18,23,53,.8);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(6px)}
.tab{font:700 15px var(--body);color:var(--muted);background:none;border:1px solid transparent;border-radius:11px;padding:9px 16px;cursor:pointer;transition:color .15s,background .15s}
.tab:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.tab[aria-selected="true"]{color:var(--on-accent);background:linear-gradient(135deg,var(--accent),#8fb6ff);box-shadow:0 0 18px rgba(56,225,255,.45),inset 0 -2px 0 rgba(0,0,0,.2)}
.tab:disabled{cursor:not-allowed;opacity:.45}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:20px;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage-wrap{display:flex;flex-direction:column;gap:14px;min-width:0}
.stage{position:relative;height:clamp(340px,64vh,660px);background:radial-gradient(120% 90% at 50% 0%,#1a2154,#0d1130 70%);border:1px solid rgba(56,225,255,.28);border-radius:20px;overflow:hidden;touch-action:none;
  box-shadow:0 0 0 1px rgba(139,92,255,.15),0 20px 60px rgba(0,0,0,.45),0 0 40px rgba(56,225,255,.12),inset 0 1px 0 rgba(255,255,255,.06)}
.stage.scrollable{touch-action:pan-y}
canvas{display:block;cursor:grab}
canvas:active{cursor:grabbing}
.hint{position:absolute;left:16px;top:14px;font-size:12px;color:var(--muted);pointer-events:none}
.fs{position:absolute;right:12px;top:12px;font:600 12px var(--body);color:var(--ink);background:rgba(25,32,72,.85);border:1px solid var(--line);border-radius:9px;padding:6px 10px;cursor:pointer}
.fs:hover{border-color:var(--accent)}
.result{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);width:min(460px,calc(100% - 28px));background:linear-gradient(160deg,#1c2457,#11163a);border:1.5px solid var(--accent);border-radius:18px;padding:14px 16px;display:flex;gap:14px;align-items:center;
  box-shadow:0 0 0 4px rgba(56,225,255,.12),0 0 40px rgba(56,225,255,.35),0 18px 40px rgba(0,0,0,.5);animation:pop .45s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{0%{transform:translate(-50%,24px) scale(.8);opacity:0}}
.badge{flex:none;min-width:86px;height:86px;padding:0 10px;border-radius:14px;background:linear-gradient(140deg,var(--pink),var(--violet));color:#fff;font-family:var(--display);font-size:48px;display:grid;place-items:center;line-height:1;
  text-shadow:0 2px 0 rgba(0,0,0,.3);box-shadow:0 0 24px rgba(255,61,129,.5)}
.res-body{min-width:0;flex:1}
.res-name{font-family:var(--display);font-size:28px;line-height:1.15;overflow-wrap:anywhere;color:#fff}
.res-lines{font-family:var(--mono);font-size:13px;color:var(--muted);margin-top:4px;display:flex;flex-direction:column;gap:1px}
.res-lines b{color:var(--accent);font-weight:700}
.res-close{flex:none;align-self:start;font-size:13px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:8px;padding:3px 8px;cursor:pointer}
.controls{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:14px 16px;background:rgba(18,23,53,.75);border:1px solid var(--line);border-radius:18px}
.rule{flex:1 1 260px;min-width:0;font-size:14px;color:var(--muted);margin:0}
.rule b{color:var(--ink)}
.rule code{font-family:var(--mono);color:var(--mark);font-size:13px}
.chips{display:flex;gap:6px;align-items:center;font-family:var(--mono)}
.chip{display:flex;flex-direction:column;align-items:center;min-width:64px;padding:4px 8px 6px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel-2);color:var(--ink);font-family:var(--mono);cursor:default}
.chip em{font:700 12px var(--body);font-style:normal;margin-top:2px;padding:2px 8px;border-radius:6px;background:var(--mark);color:var(--on-mark);visibility:hidden}
.chip.rolling{cursor:pointer;border-color:var(--mark);box-shadow:0 0 14px rgba(255,210,63,.35)}
.chip.rolling em{visibility:visible}
.chip.rolling:hover{background:color-mix(in srgb,var(--mark) 14%,var(--panel-2))}
.chip:disabled{opacity:1}
.snd{top:48px}
.zoom{position:absolute;right:12px;top:48px;display:flex;flex-direction:column;gap:5px;align-items:flex-end}
.zoom button{font:700 18px var(--body);width:38px;height:36px;color:var(--ink);background:rgba(25,32,72,.85);border:1px solid var(--line);border-radius:9px;cursor:pointer}
.zoom button:hover{border-color:var(--accent)}
.zoom .zr{font:600 12px var(--body);width:auto;height:auto;padding:6px 10px;color:var(--muted)}
.chip span{font-size:11px;color:var(--muted)}
.chip strong{font-size:26px;line-height:1.1}
.chip.rolling strong{color:var(--mark)}
.chip.fixed{border-color:var(--accent);box-shadow:0 0 12px rgba(56,225,255,.3)}
.paren{font-size:28px;color:var(--muted)}
.go{position:relative;font-family:var(--display);font-size:26px;letter-spacing:.06em;color:#fff;border:0;border-radius:16px;padding:13px 34px;cursor:pointer;
  background:linear-gradient(135deg,var(--pink),#ff8a3d);text-shadow:0 2px 0 rgba(0,0,0,.25);
  box-shadow:0 5px 0 #a3194f,0 0 28px rgba(255,61,129,.55);animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 5px 0 #a3194f,0 0 44px rgba(255,61,129,.8)}}
.go:hover{filter:brightness(1.08)}
.go:active{transform:translateY(3px);box-shadow:0 2px 0 #a3194f,0 0 20px rgba(255,61,129,.5)}
.go:disabled{opacity:.55;cursor:wait;animation:none}
.go.stop{background:linear-gradient(135deg,#ffe36a,var(--mark));color:var(--on-mark);text-shadow:none;box-shadow:0 5px 0 #a8851a,0 0 30px rgba(255,210,63,.6);animation:alarm .5s ease-in-out infinite}
@keyframes alarm{50%{box-shadow:0 5px 0 #a8851a,0 0 50px rgba(255,210,63,.95)}}
.buttons{display:flex;gap:10px;align-items:center}
.shuffle{padding:12px 16px;font-size:15px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.key{font-size:12px;color:var(--muted)}
.rankbox{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;border:1.5px solid var(--accent);border-radius:12px;background:var(--panel-2)}
.rankbox label{font-size:14px;color:var(--muted)}
.rankbox select{font:700 18px var(--body);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible,select:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:rgba(18,23,53,.82);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;backdrop-filter:blur(6px)}
.card h2{font:700 12px var(--mono);letter-spacing:.14em;color:var(--accent);margin:0;display:flex;justify-content:space-between;align-items:center;text-transform:uppercase}
label{font-size:14px;font-weight:500}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
input[type=number]{width:76px;font:700 16px var(--mono);padding:6px 8px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink)}
textarea{width:100%;box-sizing:border-box;min-height:96px;resize:vertical;font:14px/1.5 var(--body);padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink)}
.small{font-size:12px;color:var(--muted)}
.btn{font:700 14px var(--body);color:var(--ink);background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.clsrow{display:flex}
#cls{flex:1;min-width:0;font:700 17px var(--body);color:var(--ink);background:var(--paper);border:1.5px solid var(--accent);border-radius:10px;padding:8px 10px;box-shadow:0 0 14px rgba(56,225,255,.18)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#8fb6ff);color:var(--on-accent);border-color:transparent}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 45%,var(--line))}
.btn.danger:hover{border-color:var(--red)}
.inline{display:flex;flex-wrap:wrap;gap:6px}
.inline input{flex:1 1 140px;min-width:0;font:600 15px var(--body);padding:7px 10px;border:1px solid var(--accent);border-radius:9px;background:var(--paper);color:var(--ink)}
.err{color:var(--red);margin:0;flex-basis:100%}
.confirm{padding:10px 12px;border:1px solid var(--red);border-radius:12px;background:color-mix(in srgb,var(--red) 10%,var(--panel));display:flex;flex-direction:column;gap:8px}
.confirm p{margin:0;font-size:14px}
.card > p.small{margin:0}
.tag{font:700 12px var(--body);letter-spacing:0;text-transform:none;color:var(--mark)}
ol.race{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;max-height:min(58vh,520px);overflow:auto}
.race li{display:grid;grid-template-columns:40px 12px minmax(0,1fr) auto;align-items:center;gap:8px;padding:4px 8px;border-radius:8px;font-size:14px;background:rgba(255,255,255,.03)}
.race .rk{font:700 14px var(--mono);text-align:right;color:var(--ink)}
.race .dot{width:12px;height:12px;border-radius:50%}
.race .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.race .tm{font:500 12px var(--mono);color:var(--muted)}
.race li.run{opacity:.55}
.race li.target{box-shadow:inset 0 0 0 1.5px var(--mark);background:rgba(255,210,63,.08)}
.race li.win{background:linear-gradient(90deg,rgba(255,61,129,.4),rgba(139,92,255,.3));box-shadow:none;opacity:1}
.link{font:600 12px var(--body);color:var(--muted);background:none;border:0;cursor:pointer;text-decoration:underline;padding:0;letter-spacing:0;text-transform:none}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
ol.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:260px;overflow:auto}
ol.hist li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:14px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
ol.hist .num{font-family:var(--display);font-size:22px;line-height:1.2;grid-row:span 2;min-width:44px;color:var(--mark)}
ol.hist .meta{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.empty{font-size:13px;color:var(--muted)}
details summary{cursor:pointer;font-size:14px;font-weight:500}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:4px 10px;margin-top:8px;font-family:var(--mono);font-size:12px;max-height:240px;overflow:auto}
.map div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map b{color:var(--accent)}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:fullscreen .stage, .stage:fullscreen{height:100vh;border-radius:0}
@media (prefers-reduced-motion: reduce){.result,.go,.go.stop,.eyebrow i{animation:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="eyebrow"><i></i>Geometry Class · <span id="cls-label">1반</span> · 오늘은 누구?</div>
      <h1>기하 수업 룰렛</h1>
    </div>
    <div class="tabs" role="tablist" aria-label="게임 선택">
      <button class="tab" role="tab" id="tab-sphere" aria-selected="true" data-mode="sphere">구 룰렛</button>
      <button class="tab" role="tab" id="tab-dice" aria-selected="false" data-mode="dice">좌표 주사위</button>
      <button class="tab" role="tab" id="tab-marble" aria-selected="false" data-mode="marble">구슬 레이스</button>
      <button class="tab" role="tab" id="tab-pool" aria-selected="false" data-mode="pool">벡터 당구</button>
    </div>
  </header>
  <main class="layout">
    <section class="stage-wrap">
      <div class="stage" id="stage">
        <canvas id="cv" aria-label="좌표공간 3D 화면"></canvas>
        <div class="hint" id="hint">드래그하면 공간을 돌려 볼 수 있어요</div>
        <button class="fs" id="fs" type="button">전체 화면</button>
        <button class="fs snd" id="snd" type="button" hidden>소리 켜짐</button>
        <div class="zoom" id="zoom">
          <button type="button" id="zin" aria-label="확대">＋</button>
          <button type="button" id="zout" aria-label="축소">－</button>
          <button type="button" id="zreset" class="zr">처음 모양</button>
        </div>
        <div class="result" id="result" hidden>
          <div class="badge" id="r-num">12</div>
          <div class="res-body">
            <div class="res-name" id="r-name"></div>
            <div class="res-lines" id="r-lines"></div>
          </div>
          <button class="res-close" id="r-close" type="button" aria-label="결과 닫기">닫기</button>
        </div>
      </div>
      <div class="controls">
        <div class="chips" id="chips" hidden>
          <span class="paren">P(</span>
          <button class="chip" id="cx" type="button" data-k="0" disabled><span>x</span><strong>?</strong><em>멈춤</em></button>
          <button class="chip" id="cy" type="button" data-k="1" disabled><span>y</span><strong>?</strong><em>멈춤</em></button>
          <button class="chip" id="cz" type="button" data-k="2" disabled><span>z</span><strong>?</strong><em>멈춤</em></button>
          <span class="paren">)</span>
        </div>
        <div class="rankbox" id="rankbox" hidden>
          <label for="rank">당첨</label>
          <select id="rank"></select>
        </div>
        <p class="rule" id="rule"></p>
        <div class="buttons">
          <button class="btn shuffle" id="shuffle" type="button">번호 섞기</button>
          <button class="go" id="go" type="button">시작</button>
        </div>
      </div>
      <div class="sr" aria-live="polite" id="live"></div>
    </section>

    <aside class="side">
      <div class="card" id="race-card" hidden>
        <h2>실시간 순위 <span class="tag" id="race-sum"></span></h2>
        <ol class="race" id="race"></ol>
      </div>
      <div class="card">
        <h2>반 선택</h2>
        <div class="clsrow">
          <label class="sr" for="cls">반</label>
          <select id="cls"></select>
        </div>
        <div class="row">
          <button class="btn" id="cls-new" type="button">＋ 새 반</button>
          <button class="btn" id="cls-edit" type="button">이름 바꾸기</button>
          <button class="btn danger" id="cls-del" type="button">삭제</button>
        </div>
        <div class="inline" id="cls-form" hidden>
          <label class="sr" for="cls-name">반 이름</label>
          <input id="cls-name" type="text" maxlength="20" placeholder="예: 2학년 3반">
          <button class="btn primary" id="cls-ok" type="button">저장</button>
          <button class="btn" id="cls-cancel" type="button">취소</button>
          <p class="small err" id="cls-err" hidden>반 이름을 입력해 주세요.</p>
        </div>
        <div class="confirm" id="cls-confirm" hidden>
          <p id="cls-confirm-msg"></p>
          <div class="row">
            <button class="btn danger" id="cls-del-ok" type="button">삭제하기</button>
            <button class="btn" id="cls-del-cancel" type="button">취소</button>
          </div>
        </div>
        <p class="small" id="cls-note">반 목록과 발표 기록은 이 기기의 이 브라우저에 자동으로 저장돼요. 다음에 같은 브라우저로 열면 그대로 남아 있어요.</p>
      </div>
      <div class="card">
        <h2>학생 명단 <span class="tag" id="cls-tag"></span></h2>
        <div class="row">
          <label for="count">학생 수</label>
          <input type="number" id="count" min="1" max="60" value="35">
          <span class="small">명</span>
        </div>
        <label for="names">이름 (선택, 쉼표로 구분)</label>
        <textarea id="names" placeholder="예: 김민준, 이서연, 박지호&#10;비워 두면 번호로 뽑아요. 이름을 넣으면 순서대로 1번, 2번…"></textarea>
        <div class="row" style="justify-content:space-between">
          <label class="check"><input type="checkbox" id="exclude" checked> 이미 발표한 학생 제외</label>
          <button class="btn primary" id="apply" type="button">명단 저장</button>
        </div>
      </div>

      <div class="card">
        <h2>발표 기록 <button class="link" id="clear" type="button">기록 지우기</button></h2>
        <ol class="hist" id="hist"></ol>
      </div>

      <div class="card" id="map-card" hidden>
        <details>
          <summary>번호 ↔ 좌표 배정표</summary>
          <div class="small" id="map-dims" style="margin-top:6px"></div>
          <div class="map" id="map"></div>
        </details>
      </div>
    </aside>
  </main>
</div>

<script>
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, R=3, CAM=14;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const stage=$('#stage'), cv=$('#cv'), ctx=cv.getContext('2d');
let W=0,H=0,SC=1;

const store={get(){try{return JSON.parse(localStorage.getItem('space-picker')||'null')}catch(e){return null}},
             set(v){try{localStorage.setItem('space-picker',JSON.stringify(v))}catch(e){}}};

const state={mode:'sphere',exclude:true,history:[],permS:null,permG:null};

/* ---------- data ---------- */
function bestDims(n){let best=null;

function build(){
  const lines=$('#names').value.split(/[,，、\n]/).map(s=>s.trim()).filter(Boolean);

  else{const c=clamp(parseInt($('#count').value)||35,1,60);$('#count').value=c;students=Array.from({length:c},(_,i)=>({n:i+1,name:''}))}

    const m=[R*r*Math.cos(t),R*r*Math.sin(t),R*z];return {m,s:toScene(m)}});
  dimsG=N<=36?{a:3,b:3,c:4}:bestDims(N); const {a,b,c}=dimsG; center=[(a+1)/2,(b+1)/2,(c+1)/2];
  grid=[];for(let i=0;i<a*b*c;i++){const m=[i%a+1,Math.floor(i/a)%b+1,Math.floor(i/(a*b))+1];

}

function esc(t){return t.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderRule(){

  }else if(state.mode==='pool'){

function ortho(N){const n=v=>{const l=Math.hypot(...v);return v.map(x=>x/l)};

function drawSphere(c){

  {const pts=[];for(let i=0;i<72;i++){const t=i/72*TAU;pts.push(mul(Q,toScene([R*Math.cos(t),R*Math.sin(t),0])))}loop(pts,c)}

    for(let i=0;i<72;i++){const t=i/72*TAU;pts.push(mul(Q,toScene([R*Math.cos(t)*Math.cos(L),R*Math.cos(t)*Math.sin(L),R*Math.sin(t)])))}loop(pts,c)}

  }

/* the stamp itself: drops onto A, presses, lifts away */

function drawDice(c){

let actx=null,soundOn=true;
function audio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume().catch(()=>{})}catch(e){actx=null}return actx}
function knock(kind,vol){
  const a=actx;if(!a||!soundOn||a.state!=='running')return;
  try{const t=a.currentTime,out=a.createGain();out.gain.value=.9;out.connect(a.destination);
    const f=kind==='cue'?1900:1250,dur=kind==='cue'?.06:.09;
    const o=a.createOscillator(),og=a.createGain();o.type='triangle';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.55,t+dur);
    og.gain.setValueAtTime(.0001,t);og.gain.exponentialRampToValueAtTime(.55*vol,t+.002);og.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(og);og.connect(out);o.start(t);o.stop(t+dur+.02);
    const len=Math.floor(a.sampleRate*.025),buf=a.createBuffer(1,len,a.sampleRate),ch=buf.getChannelData(0);
    for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*Math.pow(1-i/len,5);
    const n=a.createBufferSource(),bp=a.createBiquadFilter(),ng=a.createGain();n.buffer=buf;bp.type='bandpass';bp.frequency.value=kind==='cue'?4200:2600;bp.Q.value=1.4;
    ng.gain.value=.9*vol;n.connect(bp);bp.connect(ng);ng.connect(out);n.start(t)}catch(e){}
}

/* ---------- vector billiards ---------- */
const PR=.2;

function poolLayout(){
  const N=students.length,cols=Math.max(2,Math.round(Math.sqrt(N*1.5))),rows=Math.ceil(N/cols);
  pl.cols=cols;pl.rows=rows;pl.cells=Array(cols*rows).fill(-1);students.forEach((s,i)=>{pl.cells[state.permS[i]]=i});
  pl.x0=cols/2;pl.y0=rows/2;pl.phase='idle';pl.s=0;pl.ev=[];

function fold(u,span){const m=2*span,v=((u%m)+m)%m;return v<=span?v:m-v}

/* ---------- animation ---------- */
let last=performance.now();
function frame(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;
  pulse=Math.max(0,pulse-dt*4);
  if(spin){
    if(spin.phase==='run'){spin.v+=(spin.vmax-spin.v)*Math.min(1,dt*2)}
    spin.pt-=dt;if(spin.pt<=0){spin.pt=1+Math.random();
      const th=Math.random()*TAU,zz=Math.random()*2-1,rr=Math.sqrt(1-zz*zz);spin.tax=[rr*Math.cos(th),zz,rr*Math.sin(th)]}
    const m=Math.min(1,dt*1.6);spin.ax=spin.ax.map((v,k)=>v+(spin.tax[k]-v)*m);
    turn(spin.ax,spin.v*dt);
  }
  if(stamp&&stamp.pending){stamp.t+=dt;
    if(!stamp.loc&&stamp.t>=STAMP_DROP){spin=null;stamp.loc=mulT(Q,front());stamp.i=nearest()} // the stamp pins the sphere
    if(stamp.t>=STAMP_HIT&&winner<0)winner=stamp.i;
    if(stamp.t>=STAMP_HIT+.4){stamp.pending=false;sphereResult()}
  }else if(stamp&&stamp.t<5)stamp.t+=dt;
  if(roll){
    const D=[dimsG.a,dimsG.b,dimsG.c];roll.tick+=dt;
    if(roll.tick>.07){roll.tick=0;for(let k=0;k<3;k++)if(!roll.fixed[k])roll.cur[k]=1+Math.floor(Math.random()*D[k]);updateChips()}
  }
  if(state.mode==='pool')stepPool(dt);
  if(state.mode==='marble')stepMarble(dt);
  else if(!busy&&!drag&&$('#result').hidden&&!reduce){
    if(state.mode==='sphere'&&!stamp)turn([0,1,0],dt*.25)}
  if(W>0){const c=colors();ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);ctx.clearRect(0,0,W,H);
    if(state.mode==='sphere'&&stamp&&stamp.t>=STAMP_DROP&&stamp.t<STAMP_DROP+.12&&!reduce){const k=(1-(stamp.t-STAMP_DROP)/.12)*7;ctx.translate((Math.random()-.5)*k,(Math.random()-.5)*k)}

}

function nearest(){const p=picked(),A=front();let best=-1,bz=-1e9;
  sphere.forEach(q=>{if(state.exclude&&p.has(students[q.st].n))return;const w=mul(Q,q.s),z=w[0]*A[0]+w[1]*A[1]+w[2]*A[2];if(z>bz){bz=z;best=q.st}});return best}

function setBusy(v){busy=v;['#cls','#cls-new','#cls-edit','#cls-del'].forEach(q=>$(q).disabled=v);if(v)closeClsPanels();document.querySelectorAll('.tab').forEach(t=>t.disabled=v);$('#apply').disabled=v;$('#shuffle').disabled=v;$('#rank').disabled=v;$('#clear').disabled=v}

    +(ks.length?'<optgroup label="여러 명">'+ks.map(k=>`<option value="last${k}">마지막 ${k}명</option>`).join('')+'</optgroup>':'');

function toggle(){
  if(state.mode==='pool'){
    audio();

    if(pl.phase==='power'){poolShoot();setGo('굴러가는 중','',true);return}
    if(busy)return;$('#result').hidden=true;winner=-1;
    if(!eligibleIdx().length){say('모두 발표했어요. 기록을 지우면 처음부터 다시 뽑을 수 있어요.',true);return}
    pl.phase='aim';pl.s=0;pl.ev=[];setBusy(true);setGo('방향 고정','stop');return}
  if(state.mode==='marble'){
    if(mb.running){mb.paused=!mb.paused;setGo(mb.paused?'계속':'일시정지',mb.paused?'':'stop');return}
    if(busy)return;$('#result').hidden=true;winner=-1;
    if(!eligibleIdx().length){say('모두 발표했어요. 기록을 지우면 처음부터 다시 뽑을 수 있어요.',true);return}
    renderRank();lineup();setBusy(true);setGo('일시정지','stop');mb.paused=false;mb.running=true;return}
  if(spin&&spin.phase==='run'){spin.phase='stamped';stamp={t:0,pending:true,loc:null,i:-1};setGo('쾅!','',true);return}
  if(roll){stopAxis(roll.fixed.indexOf(false));return}
  if(busy)return;
  $('#result').hidden=true;winner=-1;
  if(!eligibleIdx().length){say('모두 발표했어요. 기록을 지우면 처음부터 다시 뽑을 수 있어요.',true);return}
  setBusy(true);setGo(state.mode==='sphere'?'도장 찍기':'x 멈춤','stop');

function finishSphere(){
  cur=-1;stamp={loc:mulT(Q,front()),t:0,i:nearest(),pending:true};
}

  result(i,'구 룰렛',coord,[
    `<span>도장 A(${Am.map(fmt).join(', ')})</span>`,
    `<span><b>${coord}</b></span>`,

}
function finishDice(r){
  const [x,y,z]=r.target,n=x*x+y*y+z*z,f=sqrtForm(n);

    `<span><b>${coord}</b></span>`,
    `<span>xy평면 위로의 정사영 P′(${x}, ${y}, 0)</span>`,
    `<span>OP = √(${x}²+${y}²+${z}²) = ${f}${Number.isInteger(Math.sqrt(n))?'':' ≈ '+Math.sqrt(n).toFixed(2)}</span>`]);

function result(i,mode,coord,lines){

}
function resultMulti(ids,mode,coords,lines){
  const ss=ids.map(i=>students[i]);
  $('#r-num').textContent=`${ids.length}명`;$('#r-name').textContent=ss.map(s=>s.name||`${s.n}번`).join(', ');$('#r-lines').innerHTML=lines.join('');
  $('#result').hidden=false;
  ss.forEach((s,j)=>state.history.push({n:s.n,name:s.name,mode,coord:coords[j]}));renderHist();save();
  say(`${ss.map(s=>s.name||s.n+'번').join(', ')} 학생이 발표자예요.`);
  setBusy(false);setGo('다시 시작');renderRank();
}
/* live ranking beside the marble track: finished balls in order, then the rest by how far down they are */
function renderRace(){
  const el=$('#race');if(!el||state.mode!=='marble')return;
  const N=mb.balls.length,K=lastK(),tgt=state.rank==='last'?N:K?0:Math.min(+state.rank||1,N);
  const isT=r=>K?r>N-K:r===tgt;
  const run=mb.balls.filter(b=>!b.done).sort((a,b)=>b.y-a.y);
  const row=(b,r,fin)=>{const s=students[b.i],cls=[fin?'fin':'run',isT(r)?'target':'',mb.wins&&mb.wins.has(b.i)||(!mb.running&&b.i===winner&&fin)?'win':''].join(' ');
    const extra=fin?`${b.ft.toFixed(1)}초`:`${Math.round(clamp(b.y/FIN,0,1)*100)}%`;
    return `<li class="${cls}"><span class="rk">${fin?r:'('+r+')'}</span><span class="dot" style="background:${b.col}"></span><span class="nm">${esc(s.name||s.n+'번')}</span><span class="tm">${extra}</span></li>`};
  el.innerHTML=mb.order.map((b,j)=>row(b,j+1,true)).join('')+run.map((b,j)=>row(b,mb.order.length+j+1,false)).join('');
  $('#race-sum').textContent=`도착 ${mb.order.length} / ${N}`;
  // keep the interesting rows in view inside the list without scrolling the page
  const focus=!mb.running?el.querySelector('li.win'):el.querySelectorAll('li.fin')[mb.order.length-1];
  if(focus){const top=focus.offsetTop-el.offsetTop,h=el.clientHeight;if(top<el.scrollTop||top>el.scrollTop+h-60)el.scrollTop=Math.max(0,top-h*.35)}
}
function say(t,show){$('#live').textContent=t;if(show){$('#r-num').textContent='끝';$('#r-name').textContent='모두 발표했어요';
  $('#r-lines').innerHTML='<span>기록을 지우면 처음부터 다시 뽑아요.</span>';$('#result').hidden=false}}
function updateChips(){
  if(!roll)return;
  ['cx','cy','cz'].forEach((id,k)=>{const el=$('#'+id);el.querySelector('strong').textContent=roll.cur[k];
    el.classList.toggle('rolling',!roll.fixed[k]);el.classList.toggle('fixed',roll.fixed[k]);el.disabled=roll.fixed[k]});
}
function resetChips(){['cx','cy','cz'].forEach(id=>{const el=$('#'+id);el.querySelector('strong').textContent='?';el.classList.remove('rolling','fixed');el.disabled=true})}
/* stop one coordinate; its value is kept only if some remaining student can still be reached */
function stopAxis(k){
  if(!roll||k<0||roll.fixed[k])return;
  const p=picked(),cands=grid.filter(g=>g.st>=0&&!(state.exclude&&p.has(students[g.st].n))&&[0,1,2].every(j=>!roll.fixed[j]||g.m[j]===roll.cur[j]));
  const vals=[...new Set(cands.map(g=>g.m[k]))];
  roll.cur[k]=vals.includes(roll.cur[k])?roll.cur[k]:vals[Math.floor(Math.random()*vals.length)];
  roll.fixed[k]=true;pulse=1;updateChips();
  const next=roll.fixed.indexOf(false);
  if(next<0){const g=grid.find(g=>g.m.every((v,j)=>v===roll.cur[j])),r={target:roll.cur.slice(),i:g.st};roll=null;finishDice(r)}
  else setGo(`${'xyz'[next]} 멈춤`,'stop');
}

function shuffle(){
  if(busy)return;
  $('#result').hidden=true;winner=-1;cur=-1;stamp=null;resetChips();setBusy(true);$('#go').disabled=true;
  let n=0;const total=reduce?1:9;
  const id=setInterval(()=>{
    state.permS=shuffled(students.length);state.permG=shuffled(grid.length);assign();
    if(++n>=total){clearInterval(id);save();setBusy(false);$('#go').disabled=false;say('번호 위치를 섞었어요.')}
  },70);
}

/* ---------- UI ---------- */
function setMode(m){
  state.mode=m;$('#result').hidden=true;winner=-1;cur=-1;stamp=null;
  document.querySelectorAll('.tab').forEach(t=>t.setAttribute('aria-selected',t.dataset.mode===m));
  $('#chips').hidden=m!=='dice';$('#map-card').hidden=m!=='dice';$('#rankbox').hidden=m!=='marble';$('#race-card').hidden=m!=='marble';
  $('#hint').textContent=m==='pool'?'':m==='marble'?'드래그하면 위아래로 볼 수 있어요':m==='sphere'?'드래그: 구 돌리기 · ＋/－ 또는 Ctrl+휠: 확대·축소':'드래그: 회전 · ＋/－ 또는 Ctrl+휠: 확대·축소';
  if(m==='marble'){renderRank();lineup()}
  setGo('시작');
  view={yaw:-0.55,pitch:m==='sphere'?0.35:0.38,zoom:1};$('#zoom').hidden=m==='marble'||m==='pool';$('#snd').hidden=m!=='pool';stage.classList.toggle('scrollable',m==='pool');if(m==='pool'){pl.phase='idle';pl.s=0;pl.ev=[]}resetChips();renderRule();save();
}
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{if(!busy)setMode(t.dataset.mode)}));
$('#go').addEventListener('click',toggle);
$('#shuffle').addEventListener('click',shuffle);
document.addEventListener('keydown',e=>{
  if(e.code!=='Space'||e.repeat)return;const tg=e.target.tagName;
  if(tg==='INPUT'||tg==='TEXTAREA'||tg==='BUTTON'||tg==='SUMMARY')return;
  e.preventDefault();if(!$('#go').disabled)toggle()});
$('#r-close').addEventListener('click',()=>{$('#result').hidden=true;winner=-1;stamp=null});
$('#apply').addEventListener('click',()=>{if(busy)return;build();const k=curCls();k.count=$('#count').value;k.names=$('#names').value;
  $('#result').hidden=true;winner=-1;stamp=null;resetChips();renderClasses();save();say(`${k.name} 명단을 저장했어요.`);
  const b=$('#apply');b.textContent='저장했어요';setTimeout(()=>b.textContent='명단 저장',1400)});
$('#cls').addEventListener('change',e=>{if(busy){e.target.value=state.cur;return}closeClsPanels();loadClass(e.target.value)});
$('#cls-new').addEventListener('click',()=>openClsForm('new'));
$('#cls-edit').addEventListener('click',()=>openClsForm('rename'));
$('#cls-ok').addEventListener('click',submitClsForm);
$('#cls-cancel').addEventListener('click',closeClsPanels);
$('#cls-name').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitClsForm()}else if(e.key==='Escape')closeClsPanels()});
$('#cls-del').addEventListener('click',()=>{closeClsPanels();const k=curCls();
  $('#cls-confirm-msg').textContent=`${k.name}을 삭제할까요? 이 반의 명단과 발표 기록 ${k.history?k.history.length:0}건이 모두 지워져요.`;$('#cls-confirm').hidden=false});
$('#cls-del-cancel').addEventListener('click',closeClsPanels);
$('#cls-del-ok').addEventListener('click',()=>{const name=curCls().name;state.classes=state.classes.filter(k=>k.id!==state.cur);
  if(!state.classes.length)state.classes.push({id:uid(),name:'1반',count:35,names:'',history:[]});
  closeClsPanels();loadClass(state.classes[0].id);say(`${name}을 삭제했어요.`)});
const refreshMarble=()=>{renderRank();if(state.mode==='marble'&&!busy)lineup()};
$('#exclude').addEventListener('change',e=>{state.exclude=e.target.checked;refreshMarble();save()});
$('#clear').addEventListener('click',()=>{if(busy)return;state.history=[];renderHist();save();$('#result').hidden=true;winner=-1;stamp=null;refreshMarble()});
$('#rank').addEventListener('change',e=>{state.rank=e.target.value;save();renderRace()});
const zoomBy=f=>{view.zoom=clamp(view.zoom*f,.5,3.2)};
['cx','cy','cz'].forEach((id,k)=>$('#'+id).addEventListener('click',()=>stopAxis(k)));
$('#snd').addEventListener('click',()=>{soundOn=!soundOn;$('#snd').textContent=soundOn?'소리 켜짐':'소리 꺼짐';if(soundOn){audio();knock('wall',.6)}});
$('#zin').addEventListener('click',()=>zoomBy(1.2));
$('#zout').addEventListener('click',()=>zoomBy(1/1.2));
$('#zreset').addEventListener('click',()=>{view.yaw=-0.55;view.pitch=state.mode==='sphere'?0.35:0.38;view.zoom=1;if(state.mode==='sphere'&&!busy&&!stamp)Q=[1,0,0,0,1,0,0,0,1]});
// a plain wheel scrolls the page; Ctrl + wheel (and trackpad pinch) zooms the 3D view
cv.addEventListener('wheel',e=>{if(!e.ctrlKey||state.mode==='pool'||state.mode==='marble')return;e.preventDefault();zoomBy(Math.exp(-e.deltaY*.004))},{passive:false});
$('#fs').addEventListener('click',()=>{try{const p=document.fullscreenElement?document.exitFullscreen():stage.requestFullscreen();p&&p.catch&&p.catch(()=>{})}catch(e){}});

const pdist=()=>{const [a,b]=[...pointers.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
cv.addEventListener('pointerdown',e=>{if(state.mode==='pool'||(busy&&state.mode!=='dice'&&!(state.mode==='marble'&&mb.paused)))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pointers.size===2&&state.mode!=='marble'){pinch=pdist();drag=null}else if(pointers.size===1)drag={x:e.clientX,y:e.clientY};
  cv.setPointerCapture(e.pointerId)});
cv.addEventListener('pointermove',e=>{if(pointers.has(e.pointerId))pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pointers.size>=2){const d=pdist();zoomBy(d/pinch);pinch=d;return}
  if(!drag)return;
  if(state.mode==='marble'){mb.focus=null;mb.cam=clamp(mb.cam-(e.clientY-drag.y)/mb.s,0,Math.max(0,MH-H/mb.s));drag={x:e.clientX,y:e.clientY};return}
  if(state.mode==='sphere'){turn(invRot([0,1,0]),(e.clientX-drag.x)*.008);turn(invRot([1,0,0]),(e.clientY-drag.y)*.008);drag={x:e.clientX,y:e.clientY};return}
  view.yaw+=(e.clientX-drag.x)*.008;view.pitch=clamp(view.pitch+(e.clientY-drag.y)*.008,-1.5,1.5);drag={x:e.clientX,y:e.clientY}});
const endDrag=e=>{pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;if(!pointers.size)drag=null};cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);

/* ---------- boot ---------- */
const saved=store.get();
// older saves held a single roster: carry it over as the first class
state.classes=saved&&Array.isArray(saved.classes)&&saved.classes.length?saved.classes:
  [{id:uid(),name:'1반',count:(saved&&saved.count)||35,names:(saved&&saved.names)||'',history:saved&&Array.isArray(saved.history)?saved.history:[],permS:saved&&saved.permS,permG:saved&&saved.permG}];
state.cur=saved&&state.classes.some(k=>k.id===saved.cur)?saved.cur:state.classes[0].id;
if(saved){state.exclude=saved.exclude!==false;state.rank=saved.rank||'1';$('#exclude').checked=state.exclude}
state.mode=saved&&['dice','marble','pool'].includes(saved.mode)?saved.mode:'sphere';
loadClass(state.cur);resize();
requestAnimationFrame(frame);
</script>
</body>
</html>
